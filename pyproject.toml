[project]
name = "scan-pdf"
version = "0.4.10"
description = "Tools for using scanners with document feeder"
authors = [{ name = "Andreas Würl", email = "andi@tryb.de" }]
license = "Apache-2.0"
readme = "README.rst"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.1,<8.0"]

[project.scripts]
scan-pdf = "scan_pdf.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-mock>=3.14,<4",
    "pytest-cov>=7.1,<8",
    "mock>=5.1,<6",
    "assertpy>=1.1,<3",
    "basedpyright>=1,<2",
    "ruff>=0.16,<0.18",
    "pytest-gremlins>=1.13.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest-gremlins]
paths = ["src/scan_pdf"]
workers = "auto"
cache = true
report = ["console", "json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "all"
include = ["src"]
executionEnvironments = [{ root = "src" }]
# argparse.Namespace attributes are dynamically typed as Any; reportAny is
# disabled because the CLI options flow through Namespace throughout.
reportAny = "none"
